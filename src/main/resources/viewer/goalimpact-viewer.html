<!doctype html>
<!--
  The GoalImpact career-chart viewer (#22). THIS FILE IS SOURCE: it is
  hand-written and version-controlled, and ViewerWriter reads it and writes the
  filled copy to FootballData/goalimpact-viewer.html (#46). Only the copy is
  generated - never edit the copy.

  Six placeholders, all substituted by ViewerWriter. Named without their
  braces here on purpose - substitution is a plain textual replace of every
  occurrence, so a placeholder written out in this comment would be filled too,
  and the page would carry the whole population twice.
    DATA              the eligible population, careers sampled monthly
    CLUBS             every club named by a Tenure band, in index order (#23)
    CONSTANTS         ADR 0011's scale and centre, #47's rank ladder,
                      #48's burn-in boundary
    RUN_ID            the run the numbers came from
    LAST_MATCH_DATE   the last match in that run - NOT a build clock (#46)
    PLAYER_COUNT      how many players are drawn

  Since #24 the viewer is a PAGE PLUS A FOLDER: the match log ships as
  ledger/000.js … 255.js beside the generated copy, loaded a shard at a time.
  Still no server - script tags work on file:// where fetch() does not - so
  "double-click it and it works" still holds. Copying the page without the
  folder is a supported state: the chart draws and the log says what is missing.

  Descended from the prototype at docs/prototypes/player-search (variant B),
  which is throwaway and is not this.
-->
<meta charset="utf-8">
<title>GoalImpact — career charts</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --ink: #e6e9ef;
    --dim: #8b93a7; --accent: #4ea1ff; --peak: #ffb454; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  input, button, select { font: inherit; color: inherit; }
  input, select { background: var(--panel); border: 1px solid var(--line);
                  border-radius: 6px; padding: 8px 10px; }
  .dim { color: var(--dim); }
  code { font-size: 12px; color: var(--dim); }
  .chip { display: inline-block; background: #202634; border: 1px solid var(--line);
          border-radius: 99px; padding: 1px 8px; font-size: 12px; color: var(--dim);
          margin-right: 5px; }
  .row { display: flex; align-items: center; gap: 10px; }

  .grid { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column;
          min-height: 0; }
  .filters { padding: 12px; border-bottom: 1px solid var(--line);
             display: grid; gap: 8px; }
  .filters .row > * { flex: 1; min-width: 0; }
  .list { overflow: auto; flex: 1; }
  .item { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
          display: grid; grid-template-columns: 40px 1fr auto; gap: 10px;
          align-items: baseline; }
  .item:hover, .item.sel { background: var(--panel); }
  .item .rk { color: var(--dim); font-size: 12px; text-align: right; }
  .item .pk { font-variant-numeric: tabular-nums; font-weight: 600; }
  .main { padding: 20px 24px 24px; overflow: auto; }

  .idcard { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .idcard h2 { margin: 0; font-size: 24px; font-weight: 600; }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .figure { margin-right: 28px; }
  .notebar { background: #1b2330; border: 1px solid #2c3a4d; color: #a9c0da;
             border-radius: 6px; padding: 7px 11px; font-size: 13px; margin-top: 10px; }
  .foot { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 10px;
          font-size: 12px; color: var(--dim); }

  .chartwrap { position: relative; }
  .chartwrap svg { cursor: crosshair; }
  .tip { position: absolute; display: none; transform: translateX(-50%);
         background: #0b0d12; border: 1px solid var(--line); border-radius: 6px;
         padding: 5px 10px; font-size: 13px; white-space: nowrap;
         pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .tip b { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
  .tip .sep { display: inline-block; width: 1px; height: 11px; background: var(--line);
              margin: 0 8px; vertical-align: -1px; }

  /* The match log (#24). A drill-down from the chart, so it sits under it and
     shares its width; the chart stays the thing that is looked at first. */
  .log { margin-top: 20px; }
  .log h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .logscroll { max-height: 460px; overflow: auto; border: 1px solid var(--line);
               border-radius: 6px; }
  table.log { width: 100%; border-collapse: collapse; margin: 0; }
  table.log th { position: sticky; top: 0; background: var(--panel); text-align: left;
                 font-weight: 500; font-size: 12px; color: var(--dim);
                 padding: 6px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
  table.log td { padding: 5px 10px; border-bottom: 1px solid #1d222c; font-size: 13px;
                 white-space: nowrap; }
  table.log tr.r { cursor: pointer; }
  table.log tr.r:hover td { background: #1a1f29; }
  table.log tr.marked td { background: #1c2534; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: #6fce9a; } .down { color: var(--warn); }
  /* Before the chart starts. Greyed and flagged rather than blanked: these
     rows moved the rating hardest and the first drawn point is made of them,
     so withholding the number would leave the log unable to explain its own
     first point. Dimmed to about half the contrast of a drawn row. */
  table.log tr.pre td { color: #6a7285; }
  table.log tr.pre td.lvl { color: #7a8296; }
  .flag { font-size: 11px; color: #7a8296; border: 1px solid #2c3340; border-radius: 99px;
          padding: 0 6px; margin-left: 6px; }
  .unfold td { background: #12161e; white-space: normal; color: #a9b3c6;
               font-size: 12.5px; line-height: 1.6; }
  .unfold b { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>

<div id="app"></div>

<script>window.DATA={{DATA}};/*end-data*/</script>
<script>window.CLUBS={{CLUBS}};/*end-clubs*/</script>
<script>window.PINNED={{CONSTANTS}};/*end-constants*/</script>
<script>
// ---------------------------------------------------------------- the run
// The page states the run it was built from and the last match in it, and
// deliberately not the time it was built (#46): a build clock would read
// "today" over a March rating_history, which is exactly the staleness a
// separate build step risks.
const RUN = { id: "{{RUN_ID}}", lastMatch: "{{LAST_MATCH_DATE}}", players: "{{PLAYER_COUNT}}" };

// ---------------------------------------------------------------- data prep
// rows: {id,name,club,pos,goalkeeper,mins,apps,y0,y1,peak,latest,ms,vs,sm,sc,dobm}
// ms = absolute month indices (year*12 + month-1); vs = the Impact index at the
// end of that month, which is P - D(age that day) rescaled (ADR 0016). dobm is
// the date of birth on the same axis, or null.
//
// sm/sc are #23's Tenure bands, on that same month axis: sm[i] is the month a
// band opens and CLUBS[sc[i]] is the club it names. They TILE - band i runs to
// where band i+1 opens, and the last runs to the end of the line - so there is
// no closing month to ship and no gap to explain.
//
// pos and goalkeeper answer different questions and the page never merges
// them. pos is the VENDOR's position and is the only source for the outfield
// categories; goalkeeper is the RUN's career tag - stamped the first time a man
// starts in goal - and it is the one the model rated him under, so it is what
// the filter and the chip read. Where they disagree both are shown: a man the
// vendor lists in goal who never started there in a usable match was rated as a
// field player, and that is a fact about the run rather than a blemish.
const ALL = window.DATA;
const CLUBS = window.CLUBS;
const P = window.PINNED;
// 12.5% of distinct names carry accents (#35), so both sides are folded:
// typing "Nicolo Barella" must find "Nicolò Barella".
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
ALL.forEach(p => { p.f = fold(p.name); p.low = Math.min(...p.vs); });

// Counted from the data rather than quoted from the issue that measured it:
// this share moves with every run, and a number written into the page would go
// quietly stale the first time the model changed.
const BELOW_FLOOR = ALL.filter(p => p.low < 70).length;
const share = n => (100 * n / ALL.length).toFixed(1) + '%';

// 890 of the eligible players share a name with somebody (#35, worst: nine
// Paulinhos), so a hit says which one it is rather than leaving it to be
// guessed. Club and era do that work on every line; this only flags it.
const seen = new Map();
ALL.forEach(p => seen.set(p.f, (seen.get(p.f) || 0) + 1));
ALL.forEach(p => p.dupe = seen.get(p.f) > 1);

const monthLabel = m => Math.floor(m / 12) + '-' + String(m % 12 + 1).padStart(2, '0');
const yearOf = m => Math.floor(m / 12);

// Peak Impact (#41) is not drawn. ADR 0016 stage 1 landed the mechanism, so the
// engine DOES store the estimated peak P now, and the thick line below is the
// query's P - D(age that day) rather than P itself - but with the curve pinned
// flat at zero, D is zero, so P is the Impact index exactly and the second line
// would sit on top of the first. There is nothing to draw, and none is invented:
// the prototype's dashed line was an admitted stand-in over an invented ageing
// curve, and a stand-in is not something this page ships. When ADR 0016 stage 2
// fits the curve on the wide spine, the second series arrives beside vs and this
// flag turns the line, the "estimated now" figure and #40's no-date-of-birth
// clause on together. When it does, that path takes the SAME stroke as the thick
// one - url(#FADE_ID), never an opacity of its own - because #48 fades both
// lines on one ramp: their gap is the ageing penalty, a pinned curve the model
// never learned and never compressed, and fading them differently would be a lie
// about how they are computed.
const PEAK_LINE = false;

// ---------------------------------------------------------------- the chart
// The chart's geometry, worked out once and used by both the drawing and the
// crosshair. They must agree exactly - a crosshair on its own copy of these
// scales drifts off the line the moment a margin or a band changes - so the
// geometry is computed here, serialised onto the wrapper, and read back by the
// hover handler rather than recomputed there.
//
// y-axis: ADR 0011's 70..215, except that the FLOOR DROPS when a career goes
// under it (#22), because drawing a career flat against a floor says nothing.
// The ceiling stays: nobody in the population exceeds it.
function geometry(p, h) {
  const hasAge = p.dobm != null;
  const m0 = p.ms[0], m1 = p.ms[p.ms.length - 1];
  // Bands arrive as an opening month and a club index; the closing month is the
  // next band's opening, which is what "they tile" means. Worked out once, here,
  // because the drawing and the hover readout both need it and a second copy
  // would drift the first time a band was clipped differently.
  const sp = p.sm.map((m, i) => ({
    m, to: i + 1 < p.sm.length ? p.sm[i + 1] : m1, club: CLUBS[p.sc[i]]
  }));
  const RIB = sp.length ? RIBBON : 0;
  const W = 980, H = h + RIB, L = 46, R = 92, T = hasAge ? 32 : 16, B = 26 + RIB;
  const hi = 215;
  let lo = 70;
  if (p.low < lo) {
    // Rounded down to the next ten below the career's lowest point, but not
    // past 0 unless the career itself goes there: an axis running to -10 for a
    // career that bottoms at 0.3 is dead space, not information.
    lo = Math.floor((p.low - 6) / 10) * 10;
    if (p.low >= 0) lo = Math.max(0, lo);
  }
  return { W, H, L, R, T, B, RIB, m0, m1, lo, hi, dobm: p.dobm, ms: p.ms, vs: p.vs, sp };
}

// The club he was at in a given month: the last band opened at or before it.
// Null before the first band, which is a real state - a career whose opening
// months are all matches no lineup names has a line and no band under it.
const clubAt = (sp, m) => {
  let at = null;
  for (const s of sp) {
    if (s.m <= m) at = s.club; else break;
  }
  return at;
};

const scaleX = G => m => G.L + (m - G.m0) / Math.max(1, G.m1 - G.m0) * (G.W - G.L - G.R);
const scaleY = G => v => G.T
  + (G.hi - Math.max(G.lo, Math.min(G.hi, v))) / (G.hi - G.lo) * (G.H - G.T - G.B);

// The zones the chart shades, low to high: from the population average up
// through #47's seven rank steps. Nine regions in all - the ninth, below the
// average, is left bare, so a career in it is read against the surface itself.
const zoneEdges = hi => [P.CENTRE, ...[...P.TICKS].reverse().map(t => t.index), hi];

// One hue, lightness climbing with the zone (OKLCH h=172, L 0.202 to 0.300),
// so the shading is an ORDERED ramp and not eight unrelated colours - the
// regions are ranked, and a rainbow would deny it. Deliberately far below the
// contrast a data mark would need: these sit BEHIND the line, and a zone's
// name is written beside it, so the tint never carries identity alone.
//
// The ramp is concave (L climbs as t^0.62) for a reason that only showed up on
// screen. A straight ramp put its biggest steps at the top, where the zones are
// widest and emptiest - above Top 20 is 38 index points of almost nobody - so
// the chart read as a green wall with the careers crowded into the dim half.
// Curving it spends the contrast low down, where careers actually live, and
// leaves the top two zones nearly equal, which costs nothing since one of them
// is empty.
const ZONE_FILL = ['#141716', '#16201c', '#172420', '#172823',
                   '#172b25', '#182e27', '#18312a', '#18342c'];

// #23's club bands, in three channels and deliberately not in the zones' own.
// ADR 0011 reserved the chart's background ALONG THE TIME AXIS for them, and
// #47's rank zones then filled the same pixels with an ordered ramp - so a
// second tint deep enough to name a club by colour would have destroyed the
// ordering the ramp exists for. Instead:
//
//   the WASH   alternate bands lifted by one flat white veil, which adds the
//              same amount to every zone and so leaves the ramp's order intact;
//   the RULE   a line at each move, from the top of the plot through the
//              ribbon, because "tie a rating change to a move" is what the
//              ticket asked for and a tint alone does not do it;
//   the RIBBON a strip under the plot floor carrying the club's NAME, where
//              there is room to read one and nothing to read it against.
//
// Names are never carried by colour: the two ribbon fills alternate to separate
// neighbours and mean nothing on their own, exactly as the zone ramp's tint
// never carries a rank alone.
const BAND_WASH = 0.024;
const BAND_RULE = '#4d566c';
const BAND_FILL = ['#1b2029', '#232936'];

// A name is drawn where it fits and nowhere else: 11px runs about 6.1px a
// character. A band too narrow keeps its wash and its rule and loses its label,
// which is #47's rule for a crowded rung - the band is the fact, the name is the
// reading - and the hover readout names the club at any month regardless.
function bandLabel(name, w) {
  const room = Math.floor((w - 8) / 6.1);
  if (room >= name.length) return name;
  return room >= 6 ? name.slice(0, room - 1) + '…' : null;
}

// The burn-in fade (#48). At the start of a run every rating is still near its
// seed, so the population has not spread out: the mean is 100 by construction
// and it is the SPREAD that is short, which matters here because the shaded
// zones are sigma multiples. Through the opening years the ruler is about a
// tenth too wide and every career reads mid-table when it was not.
//
// So the line is drawn and faded, never withheld: a 2013 rating is a real
// measurement that is merely squashed, and the ordering within those years is
// informative even where the level is not. Truncation was rejected outright,
// and a fade that approached invisible would be truncation in disguise - hence
// P.BURNIN_FLOOR, which is a decision and not a taste.
//
// A GRADIENT rather than per-segment opacity, and rather than a tinted
// background: #23 already claims the chart's background along the time axis for
// club spells, and a second tint in the same channel could not be told from it.
// One ramp, anchored in USER SPACE at the run's opening month and the pinned
// boundary - so the opacity at a date is the same on every player's chart, and a
// career that starts halfway up the ramp starts halfway up it rather than at the
// floor. Beyond the boundary the gradient pads at full strength by itself.
//
// One ramp for BOTH lines, which is why this is one paint referenced by id
// rather than an opacity per path: #41's dashed peak is the same quantity seen
// the other way round, so compressing one compresses the other by exactly as
// much. Their gap is the ageing penalty - a pinned curve the model never learned
// and never compressed - and fading both equally is what keeps it readable.
//
// What does NOT fade: the shaded zones, the rank rungs, the average line and
// both axes. The honest statement is "the line is unreliable here", not "the
// ruler moved" - fading the ruler would say we are unsure what good means.
const FADE_ID = 'burnin';

// The ribbon #23's club names are written in, under the plot floor and above the
// year labels. It costs the CHART height rather than the plot's: h is what the
// line gets either way, and a player with no club on record gets no ribbon and
// no hole where one would have been.
const RIBBON = 22;

// Club names are the vendor's and 31 of them carry an apostrophe or an
// ampersand - Connah's Quay Nomads, Brighton & Hove Albion - so they cannot go
// into markup raw. Two escapes because they are two jobs: `esc` for a text node,
// and `attr` for the single-quoted data-geom attribute the hover handler parses
// back, where one unescaped apostrophe truncates the attribute and takes the
// whole crosshair down with it.
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const attr = s => String(s).replace(/&/g, '&amp;').replace(/'/g, '&#39;');

// Said once, read twice: the chart's label names the pale stretch and the hover
// readout repeats it over a number. They are the same claim, so they are the
// same string - two spellings of it would drift the first time either was
// reworded, and a caption disagreeing with a tooltip about what is wrong with a
// number is worse than either alone.
const SETTLING = 'model still settling';

function fadePaint(x) {
  return `<defs><linearGradient id="${FADE_ID}" gradientUnits="userSpaceOnUse"
      x1="${x(P.BURNIN_FROM).toFixed(1)}" y1="0" x2="${x(P.BURNIN_BOUNDARY).toFixed(1)}" y2="0">
    <stop offset="0" style="stop-color:var(--accent);stop-opacity:${P.BURNIN_FLOOR}"/>
    <stop offset="1" style="stop-color:var(--accent);stop-opacity:1"/>
  </linearGradient></defs>`;
}

function chart(p, h = 340) {
  const geom = geometry(p, h);
  const { W, H, L, R, T, B, RIB, m0, m1, lo, hi, sp } = geom;
  const hasAge = p.dobm != null;
  const dropped = lo < 70;
  const x = scaleX(geom), y = scaleY(geom);
  // Three states, and they are different pages rather than degrees of one: a
  // career that spans the boundary carries the fade AND the labelled line; one
  // that starts after it carries neither; one that ENDS before it carries a
  // fade with nothing solid beside it to be read against, so it gets a sentence
  // instead (see below).
  const fading = m0 < P.BURNIN_BOUNDARY;
  const boundaryInView = P.BURNIN_BOUNDARY > m0 && P.BURNIN_BOUNDARY < m1;
  const endsInsideBurnIn = m1 <= P.BURNIN_BOUNDARY;

  let g = '';
  // The bands, shaded. The zones are the rank ladder's own steps, so the
  // shading and the labels down the right edge say the same thing twice -
  // which is the point: the tint is never the only thing carrying a zone's
  // identity. Everything below the average is left bare.
  const edges = zoneEdges(hi);
  for (let i = 0; i < ZONE_FILL.length; i++) {
    const top = Math.min(hi, edges[i + 1]), bottom = Math.max(lo, edges[i]);
    if (top <= bottom) continue;
    g += `<rect x="${L}" y="${y(top)}" width="${W - L - R}"`
       + ` height="${(y(bottom) - y(top)).toFixed(1)}" fill="${ZONE_FILL[i]}"/>`;
  }

  // #23's wash, laid straight over the zones and under everything else: one
  // flat veil on alternate club bands, so every zone under it gains the same
  // amount and the ramp's ordering survives being tinted a second time.
  sp.forEach((s, i) => {
    if (i % 2 === 0) return;
    g += `<rect x="${x(s.m).toFixed(1)}" y="${T}" width="${(x(s.to) - x(s.m)).toFixed(1)}"`
       + ` height="${H - T - B}" fill="#ffffff" opacity="${BAND_WASH}"/>`;
  });

  // The population average - the one number the whole index is defined
  // against (ADR 0011), and the one thing a rank cannot say. Drawn brighter
  // than a zone edge because it is a landmark rather than a step.
  if (P.CENTRE >= lo && P.CENTRE <= hi) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(P.CENTRE)}" y2="${y(P.CENTRE)}" stroke="#3c4456"/>`
       + `<text x="${L - 6}" y="${y(P.CENTRE) + 4}" fill="#6d768c" font-size="11"`
       + ` text-anchor="end">${P.CENTRE}</text>`
       + `<text x="${L + 6}" y="${y(P.CENTRE) - 4}" fill="#4a5265" font-size="10">average</text>`;
  }
  if (lo < 70) {
    for (let v = Math.ceil(lo / 20) * 20; v < 100; v += 20) {
      if (v < lo) continue;
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#232935"/>`
         + `<text x="${L - 6}" y="${y(v) + 4}" fill="#6d768c" font-size="11" text-anchor="end">${v}</text>`;
    }
  }

  // #47's ladder, now drawn all the way across as the boundary between two
  // shaded zones rather than as a tick on the edge. Pinned constants measured
  // once, never recomputed at build time - a mid-season rebuild would rank
  // against half a season. The ladder stops at Top 2000, and below it both the
  // shading and the right-hand edge are blank.
  // A career that drops far below the floor stretches the axis until the rungs
  // are pixels apart, so a rung keeps its line and loses its labels rather than
  // stacking them into a smear. The line is the fact; the label is the reading.
  let lastLabel = -Infinity;
  for (const t of P.TICKS) {
    if (t.index < lo || t.index > hi) continue;
    g += `<line x1="${L}" x2="${W - R + 5}" y1="${y(t.index)}" y2="${y(t.index)}" stroke="#39404f"/>`;
    if (y(t.index) - lastLabel < 12) continue;
    lastLabel = y(t.index);
    g += `<text x="${L - 6}" y="${y(t.index) + 4}" fill="#6d768c" font-size="11"`
       + ` text-anchor="end">${t.index.toFixed(1)}</text>`
       + `<text x="${W - R + 9}" y="${y(t.index) + 4}" fill="#6d768c" font-size="11">${t.label}</text>`;
  }
  g += `<text x="${W - R + 9}" y="${T - 4}" fill="#4a5265" font-size="10">rank</text>`;

  for (let yr = yearOf(m0); yr <= yearOf(m1) + 1; yr++) {
    const m = yr * 12;
    if (m < m0 || m > m1) continue;
    g += `<line x1="${x(m)}" x2="${x(m)}" y1="${T}" y2="${H - B}" stroke="#1c212c"/>`
       + `<text x="${x(m)}" y="${H - 8}" fill="#6d768c" font-size="11" text-anchor="middle">${yr}</text>`;
  }

  // The boundary itself, drawn once and at full strength: it is an annotation
  // about the model, not a thing the model computed. The label carries the
  // reason, so the fade beside it is not left as a mystery - the fade works
  // where the eye already is, and the label explains it once.
  //
  // It takes whichever side of the line has room, and says a different true
  // thing on each rather than pointing the same words the wrong way: a chart
  // that begins just before the boundary has no room on the left for a caption
  // about the left.
  if (boundaryInView) {
    const bx = x(P.BURNIN_BOUNDARY);
    g += `<line x1="${bx.toFixed(1)}" x2="${bx.toFixed(1)}" y1="${T}" y2="${H - B}"`
       + ` stroke="#5b6478" stroke-dasharray="4 3"/>`;
    // Both sides name the pale stretch rather than only the line, so the reason
    // survives either placement; the arrow is dropped on the right, where it
    // would point away from the thing it is about.
    g += bx - L > 170
      ? `<text x="${(bx - 7).toFixed(1)}" y="${T + 13}" fill="#7b849a" font-size="11" text-anchor="end">◂ ${SETTLING}</text>`
      : `<text x="${(bx + 7).toFixed(1)}" y="${T + 13}" fill="#7b849a" font-size="11">${SETTLING} to the left</text>`;
  }

  // Age along the top, calendar years along the bottom (#37): the same line
  // read two ways, a birthday tick and a new-year tick.
  if (hasAge) {
    const a0 = (m0 - p.dobm) / 12, a1 = (m1 - p.dobm) / 12;
    const step = (a1 - a0) > 14 ? 2 : 1;
    for (let a = Math.ceil(a0 / step) * step; a <= a1; a += step) {
      const m = p.dobm + a * 12;
      g += `<line x1="${x(m)}" x2="${x(m)}" y1="${T}" y2="${T + 4}" stroke="#39404f"/>`
         + `<text x="${x(m)}" y="${T - 8}" fill="#6d768c" font-size="11" text-anchor="middle">${a}</text>`;
    }
    g += `<text x="${L - 6}" y="${T - 8}" fill="#525b70" font-size="10" text-anchor="end">age</text>`;
  }

  // The ribbon and the move rules, drawn last of the background so a rule sits
  // over the year gridlines it would otherwise be lost among. Full strength
  // through the burn-in like the zones and the axes (#48): where he was playing
  // is not something the model computed, so there is nothing about it to
  // disown - only the LINE was unreliable in 2013, never the transfer.
  if (RIB) {
    const ry = H - B + 6, rh = 16;
    sp.forEach((s, i) => {
      const x0 = x(s.m), w = x(s.to) - x0;
      g += `<rect x="${x0.toFixed(1)}" y="${ry}" width="${w.toFixed(1)}" height="${rh}"`
         + ` fill="${BAND_FILL[i % 2]}"/>`;
      // No rule before the first band: it opens where the line does, so there
      // is no move there to mark - only the start of the drawn career.
      if (i) {
        g += `<line x1="${x0.toFixed(1)}" x2="${x0.toFixed(1)}" y1="${T}" y2="${ry + rh}"`
           + ` stroke="${BAND_RULE}"/>`;
      }
      const label = bandLabel(s.club, w);
      if (label) {
        g += `<text x="${(x0 + w / 2).toFixed(1)}" y="${ry + 11.5}" fill="#9aa4b8"`
           + ` font-size="11" text-anchor="middle">${esc(label)}</text>`;
      }
    });
  }

  const d = p.ms.map((m, i) =>
    (i ? 'L' : 'M') + x(m).toFixed(1) + ' ' + y(p.vs[i]).toFixed(1)).join(' ');

  return `<div class="chartwrap" data-geom='${attr(JSON.stringify(geom))}'>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
      ${fading ? fadePaint(x) : ''}
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="#12151c"/>
      ${g}
      <path d="${d}" fill="none" stroke="${fading ? `url(#${FADE_ID})` : 'var(--accent)'}"
            stroke-width="2.2"/>
      <g class="cursor" style="display:none">
        <line class="cx" y1="${T}" y2="${H - B}" stroke="#6d768c" stroke-dasharray="3 3"/>
        <circle class="cdot" r="4.5" fill="var(--accent)" stroke="#0f1115" stroke-width="2"/>
      </g>
    </svg>
    <div class="tip"></div>
  </div>`
  // A fade works by CONTRAST, and this career has none: it is pale from end to
  // end with no solid stretch beside it, so the fade collapses into house style.
  // The boundary label cannot rescue him either - it sits past his retirement,
  // off the right of his chart, so it is never drawn. He is the reader most at
  // risk of reading a squashed career as a modest one, so the page says in words
  // what the chart cannot show by itself.
  //
  // Third instance of a pattern set twice already: #36 draws the careers with no
  // date of birth normally and prints "no date of birth — no age axis"; #40 adds
  // a clause saying their two lines run a fixed distance apart. Draw the normal
  // chart, and say the one true thing it cannot say. Dropping his bands and
  // rungs was rejected: it would make his page a different KIND of page, and
  // missing bands read as "we have no ruler for this era", which is untrue. We
  // have the ruler; it is the line that is soft.
  + (endsInsideBurnIn ? `<div class="notebar">This career ends before <b>${P.BURNIN_LABEL}</b>, so it
       falls entirely inside the model's settling period — the whole line is drawn faded and
       there is no full-strength stretch beside it for comparison. The population had not
       spread out yet, so this career reads low against the zones. The shape of the line, and
       where it rises and falls, are unaffected.</div>` : '')
  + (dropped ? `<div class="notebar">Floor dropped from 70 to <b>${lo}</b> — this career
       reaches <b>${p.low.toFixed(1)}</b>. ${BELOW_FLOOR.toLocaleString()} of
       ${ALL.length.toLocaleString()} eligible players (${share(BELOW_FLOOR)}) go below 70
       at some point, and nothing is drawn flat against the floor.</div>` : '')
  // Fourth instance of #36's pattern: draw the normal chart, and say the one
  // true thing it cannot show. No lineup the snapshot holds names a club for
  // any match he played that the chart draws - most often because the matches
  // were rated off a Derived lineup - so there is no band to draw and its
  // absence would otherwise read as "he never moved".
  + (sp.length ? '' : `<div class="notebar">No club is recorded for any of the matches
       drawn here, so this career carries no club bands. The line is unaffected — the run
       rates a player, and knowing which club he was at has never been part of it.</div>`)
  + (hasAge ? '' : `<div class="notebar">No date of birth in the snapshot — no age axis.
       The shaded bands are flat, so this career is judged against exactly the same
       zones as everybody else.${PEAK_LINE ? ` The estimated peak uses the
       population-average ageing penalty here, so the two lines run a fixed distance
       apart for the whole career and the gap between them carries no information.` : ''}</div>`);
}

// The chart and the log point at each other, across a mismatch of grain: a
// chart point is a MONTH and a log row is a MATCH, so one point covers 1–6
// rows. Held in one object because both directions need the same two
// translations - a month to a set of rows, and a month to a pixel - and two
// copies of that would drift the moment a margin changed.
const LINK = {
  byMonth: null, scroller: null,
  markChart: () => {},       // replaced by wireHover once a chart exists
  markRows(month) {
    if (!this.byMonth) return;
    document.querySelectorAll('tr.marked').forEach(tr => tr.classList.remove('marked'));
    const block = this.byMonth.get(month);
    if (!block) return;
    block.forEach(tr => tr.classList.add('marked'));
    // Scrolled into the middle rather than to the top edge: the block's
    // neighbours are the context that says what a jump in the line came after.
    const s = this.scroller, t = block[0];
    s.scrollTop = t.offsetTop - s.clientHeight / 2 + t.offsetHeight / 2;
  }
};

// The crosshair snaps to the nearest sampled month rather than interpolating:
// the model only forms an opinion after a match, so a value invented between
// two months would be a picture of nothing.
function wireHover(root) {
  const wrap = root.querySelector('.chartwrap[data-geom]');
  if (!wrap) return;
  const G = JSON.parse(wrap.dataset.geom);
  const svg = wrap.querySelector('svg'), cur = wrap.querySelector('.cursor');
  const cx = wrap.querySelector('.cx'), dot = wrap.querySelector('.cdot');
  const tip = wrap.querySelector('.tip');
  const px = scaleX(G), py = scaleY(G);

  // The log's half of the link: put the crosshair on the point covering a
  // month, without the pointer being anywhere near the chart.
  LINK.markChart = month => {
    const at = month == null ? -1 : G.ms.indexOf(month);
    if (at < 0) { cur.style.display = 'none'; return; }
    cur.style.display = '';
    cx.setAttribute('x1', px(G.ms[at])); cx.setAttribute('x2', px(G.ms[at]));
    dot.setAttribute('cx', px(G.ms[at])); dot.setAttribute('cy', py(G.vs[at]));
  };

  // Clicking a point jumps the log to the month it samples. The chart's
  // geometry is already date-based, so this costs nothing new.
  svg.onclick = e => {
    const r = svg.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * G.W;
    const m = G.m0 + (vx - G.L) / (G.W - G.L - G.R) * (G.m1 - G.m0);
    let best = 0;
    for (let i = 1; i < G.ms.length; i++) {
      if (Math.abs(G.ms[i] - m) < Math.abs(G.ms[best] - m)) best = i;
    }
    LINK.markRows(G.ms[best]);
  };

  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * G.W;
    const m = G.m0 + (vx - G.L) / (G.W - G.L - G.R) * (G.m1 - G.m0);
    let best = 0;
    for (let i = 1; i < G.ms.length; i++) {
      if (Math.abs(G.ms[i] - m) < Math.abs(G.ms[best] - m)) best = i;
    }
    const mm = G.ms[best], v = G.vs[best];
    cur.style.display = '';
    cx.setAttribute('x1', px(mm)); cx.setAttribute('x2', px(mm));
    dot.setAttribute('cx', px(mm)); dot.setAttribute('cy', py(v));
    const age = G.dobm == null ? null : (mm - G.dobm) / 12;
    // A fade does nothing to a NUMBER (#48): 154.2 looks equally certain in pale
    // ink, and somebody hovering has just moved from "roughly where was he" to
    // "exactly where was he" - the most exposed reader on the page. So the
    // caveat rides with the readout inside the boundary. The number itself is
    // never suppressed and never rescaled: withholding it reads as missing data
    // when nothing is missing, and a corrected number would claim we have the
    // right answer when we have only a differently-stretched wrong one - the
    // early model had genuinely seen less football, so the reading is noisier
    // as well as squashed.
    // The club at that month, which is what makes a narrow band readable: the
    // ribbon drops a name it has no room for, and the readout always has one.
    const club = clubAt(G.sp, mm);
    tip.innerHTML = `<b>${v.toFixed(1)}</b><span class="dim">Impact</span>
      <span class="sep"></span>${monthLabel(mm)}
      ${age == null ? '<span class="sep"></span><span class="dim">age unknown</span>'
                    : `<span class="sep"></span>age ${age.toFixed(1)}`}
      ${club ? `<span class="sep"></span>${esc(club)}` : ''}
      ${mm < P.BURNIN_BOUNDARY
          ? `<span class="sep"></span><span class="dim">${SETTLING}</span>` : ''}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(px(mm) / G.W * r.width, 60), r.width - 60) + 'px';
    tip.style.top = (py(v) / G.H * r.height - 44) + 'px';
  };
  svg.onmouseleave = () => { cur.style.display = 'none'; tip.style.display = 'none'; };
}

// ------------------------------------------------------------- the match log
// #24. The chart is 607,016 monthly points for the whole population and fits in
// the page; the log is 2,185,765 matches and does not - ~210 MB against 12 MB.
// So it ships as ledger/000.js … 255.js beside this file, sharded player_id %
// 256, and one shard is fetched when a player is opened. <script> rather than
// fetch(), because fetch() is blocked on file:// and script tags are not: the
// viewer is still a page you double-click.
//
// A shard calls this back with its own name, which is how a file that loaded
// but is not what it claims can be told from one that never loaded at all.
// Keyed by that name and never by load order: two shards can be in flight at
// once if the reader clicks twice, and "the last payload that arrived" is then
// the wrong answer to "did MY file load".
const LOADED = {};
window.GI_LEDGER = (name, payload) => { LOADED[name] = payload; };

// Both from the constants block, so the page never carries its own copy of a
// decision LedgerWriter made: it picks a shard with exactly the arithmetic that
// wrote them, and asks for it by the folder's own name.
const shardName = id => String(id % P.LEDGER_SHARDS).padStart(3, '0');

// Guards, and they are deliberately WEAKER than the chart's (#24). The page
// refuses to draw at all over a results file with no career tags, because a
// missing Goalkeeper flag silently changed a drawn line. A missing or wrong-run
// ledger changes nothing drawn - so the chart is drawn regardless and the log
// panel says, in words, why it is empty. Holding a correct chart hostage to a
// log would be the wrong trade.
//
// Three failures, each named separately, because "no log" is not a diagnosis:
// no folder at all, a folder missing this shard (half-copied), and a folder
// from another run. Only the last is a refusal of something that IS there, and
// it is absolute: a wrong-run log is never shown, because every number in it
// would look exactly like a right one.
function withLedger(id, done) {
  const name = shardName(id);
  const file = `${P.LEDGER_FOLDER}/${name}.js`;
  if (LOADED[name]) return done(check(LOADED[name]));
  const el = document.createElement('script');
  el.src = file;
  // A file that loads without calling back is one that is not a shard at all -
  // truncated, or something else entirely under the right name.
  el.onload = () => done(LOADED[name] === undefined
    ? { error: `${file} loaded but is not a match-log shard.` }
    : check(LOADED[name]));
  el.onerror = () => done({ error: `No ${file} beside this page. The match log ships as a
      folder of ${P.LEDGER_SHARDS} files next to the viewer; if you copied the page on its
      own, copy the ${P.LEDGER_FOLDER} folder too. The chart above is unaffected.` });
  document.head.appendChild(el);
}

function check(shard) {
  if (!shard) return { error: 'That shard is missing from the ledger folder.' };
  if (shard.run !== RUN.id) {
    return { error: `The ledger folder was written by run ${shard.run}, and this page by
      ${RUN.id}. A log from another run is not shown: every number in it would look
      exactly like a right one. Rebuild the viewer to refresh both together.` };
  }
  return { shard };
}

// One career, unpacked from the shard's columnar arrays into the two things a
// row needs that are not stored: the rating it came IN at, and the exposure it
// left with.
//
// Neither is stored because neither has to be. after(i) == before(i+1) - a
// rating is frozen for a whole match and moves once, at the whistle (the
// glossary's Rating period) - so one rating per row plus the career's opening
// value is the whole chain. Exposure is the running sum of the minutes each row
// already carries.
function career(shard, id) {
  const c = shard.players[String(id)];
  if (!c) return null;
  const rows = [];
  let before = c.p0, mins = c.b0;
  for (let i = 0; i < c.d.length; i++) {
    const after = c.v[i];
    mins += c.m[i];
    rows.push({
      i, date: new Date(c.d[i] * 86400000), matchId: c.g[i],
      club: c.c[i] == null ? null : shard.clubs[c.c[i]],
      opp: c.o[i] == null ? null : shard.clubs[c.o[i]],
      comp: c.k[i] == null ? null : shard.comps[c.k[i]],
      gf: c.gf[i], ga: c.ga[i], mins: c.m[i],
      goals: c.gv[i], drained: c.xd[i], residual: c.r[i],
      before, after, level: c.l[i], exposure: mins,
      // The chart starts at ADR 0011's threshold, so everything under it is a
      // real rating period the line never drew.
      drawn: mins >= P.ELIGIBLE_MINUTES
    });
    before = after;
  }
  for (const r of rows) {
    r.month = r.date.getUTCFullYear() * 12 + r.date.getUTCMonth();
    // How far this match moved him ON THE INDEX, which is the column the chart
    // draws - not the Value move, which the unfolded row gives instead. Null on
    // the first match rather than zero: he came in at p0, but the level p0 sits
    // at needs the ageing curve on that day, and the shard ships the curve's
    // answer per ROW. A dash is the honest reading of "there is nothing before
    // this"; a 0.0 would claim he arrived exactly where he left.
    r.move = r.i === 0 ? null : rows[r.i - 1].level != null ? r.level - rows[r.i - 1].level : null;
  }
  return rows;
}

const iso = d => d.toISOString().slice(0, 10);
const signed = (n, dp = 2) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(dp);

// The result, from HIS side of it, always. No home/away marker: the vendor's
// home label is administrative and names nobody at a neutral host (the
// glossary's Home side), so a marker read off it would assert a venue fact the
// data does not carry.
function resultCell(r) {
  if (r.gf == null || r.ga == null) return '<span class="dim">—</span>';
  const w = r.gf > r.ga ? 'W' : r.gf < r.ga ? 'L' : 'D';
  const cls = w === 'W' ? 'up' : w === 'L' ? 'down' : 'dim';
  return `<span class="${cls}">${w}</span> ${r.gf}–${r.ga}`;
}

// The row's arithmetic, spelled out. This is the half of the log #24 was for:
// "this match charged you +0.62" is a report, and "you were on for +3.00 where
// the model expected +2.38 from those lineups" is an explanation. The two
// halves come from the run itself - they are not re-derived here, and they are
// not derived from each other either, because the residual is summed in event
// order and re-adding its halves would re-associate a floating-point sum.
function unfold(r) {
  const move = r.after - r.before;
  return `<tr class="unfold"><td colspan="${PEAK_LINE ? 9 : 8}">
    On the pitch his side's goal difference moved <b>${signed(r.goals)}</b> goals, and the
    model expected <b>${signed(-r.drained)}</b> from those lineups over his
    <b>${r.mins.toFixed(0)}</b> minutes — so the match charged him a residual of
    <b>${signed(r.residual)}</b> goals.
    His rating went <b>${r.before.toFixed(3)}</b> → <b>${r.after.toFixed(3)}</b>
    (${signed(move, 3)} Value), which is <b>${r.level.toFixed(1)}</b> on the Impact index.
    Career exposure after this match: <b>${Math.round(r.exposure).toLocaleString()}</b> minutes.
    ${r.drawn ? '' : `<span class="dim">Under ${P.ELIGIBLE_MINUTES.toLocaleString()} minutes,
      so the chart does not draw this match — but it is a real rating period, and the update
      factor is largest exactly here, when the model knows least.</span>`}
  </td></tr>`;
}

// The Impact index rescale, for the one number a row needs that the shard does
// not ship: index(P), the PEAK line. The level - index(P - D(age that day)) -
// is shipped instead of derived, because deriving it would need the ageing
// curve here (see LedgerWriter); this one needs no curve at all, only ADR
// 0011's four pinned constants, which the page already carries.
const impact = v => P.CENTRE + P.POINTS_PER_SD * (v - P.VALUE_MEAN) / P.VALUE_SD;

// #24 asks a row to speak BOTH lines - level and peak. It shows one, for the
// same reason the chart draws one line and not two: with the ageing curve
// pinned flat, D is zero, so index(P) IS the level and a peak column would
// repeat the column beside it to the decimal. PEAK_LINE is the single flag that
// turns the second line on across this page, and it turns this column on with
// it rather than leaving the log to be remembered separately (#41, ADR 0016).
function logRows(rows) {
  return rows.map(r => `<tr class="r ${r.drawn ? '' : 'pre'}" data-i="${r.i}"
      data-month="${r.month}" data-drawn="${r.drawn ? 1 : 0}">
    <td>${iso(r.date)}</td>
    <td class="dim">${r.comp || '—'}</td>
    <td>${r.club || '<span class="dim">club unknown</span>'}</td>
    <td class="dim">v ${r.opp || '—'}</td>
    <td>${resultCell(r)}</td>
    <td class="num">${r.mins.toFixed(0)}'</td>
    <td class="num ${r.residual > 0 ? 'up' : r.residual < 0 ? 'down' : ''}">${signed(r.residual)}</td>
    <td class="num lvl">${r.level.toFixed(1)}
      <span class="${r.move > 0 ? 'up' : r.move < 0 ? 'down' : 'dim'}"
            style="font-size:11px">${r.move == null ? '—' : signed(r.move, 1)}</span>
      ${r.drawn ? '' : '<span class="flag">pre-chart</span>'}</td>
    ${PEAK_LINE ? `<td class="num lvl">${impact(r.after).toFixed(1)}</td>` : ''}
  </tr>`).join('');
}

// The panel, and the two-way link with the chart across a mismatch of grain: a
// chart point is a MONTH and a log row is a MATCH, so one point covers 1–6 rows.
// Clicking a point scrolls to that month and marks the whole block; hovering a
// row marks the point that contains it. Pre-threshold rows mark nothing, which
// is the same statement their flag makes.
function renderLog(p, root) {
  const panel = root.querySelector('#logpanel');
  withLedger(p.id, res => {
    // A shard load is asynchronous and a reader can click the next name while
    // it is in flight. Everything below writes into LINK and into the panel,
    // both of which now belong to somebody else - so a callback that lands
    // after its player stopped being the current one does nothing at all.
    // Clearing LINK in show() cannot cover this: the stale callback arrives
    // AFTER that clear, which is exactly what makes it stale.
    if (cur !== p) return;
    if (res.error) {
      panel.innerHTML = `<h3>Match log</h3><div class="notebar">${res.error}</div>`;
      return;
    }
    const rows = career(res.shard, p.id);
    if (!rows) {
      panel.innerHTML = `<h3>Match log</h3><div class="notebar">This run logged no matches
        for him, which should not happen for a charted player.</div>`;
      return;
    }
    const pre = rows.filter(r => !r.drawn).length;
    panel.innerHTML = `<h3>Match log <span class="dim" style="font-weight:400;font-size:13px">
        — ${rows.length.toLocaleString()} matches that counted${pre ? `, of which
        ${pre.toLocaleString()} before the chart starts` : ''}</span></h3>
      <div class="logscroll"><table class="log">
        <thead><tr><th>Date</th><th>Competition</th><th>Club</th><th>Opponent</th>
          <th>Result</th><th class="num">Min</th><th class="num">Residual</th>
          <th class="num">Impact</th>${PEAK_LINE ? '<th class="num">Peak</th>' : ''}
          </tr></thead>
        <tbody>${logRows(rows)}</tbody></table></div>
      <p class="dim" style="font-size:12px">Every match the model rated him in, including the
        ${P.ELIGIBLE_MINUTES.toLocaleString()} minutes the chart will not draw. Residuals are in
        goals — actual less expected — and Impact is the same index the chart draws. Matches
        that were skipped or missing entirely are a different question (#25) and are not here.
        Click a row for the arithmetic; click a point on the chart to jump to its month.</p>`;

    const body = panel.querySelector('tbody');
    const byMonth = new Map();
    panel.querySelectorAll('tr.r').forEach(tr => {
      const m = +tr.dataset.month;
      if (!byMonth.has(m)) byMonth.set(m, []);
      byMonth.get(m).push(tr);
    });
    LINK.byMonth = byMonth;
    LINK.scroller = panel.querySelector('.logscroll');

    body.onclick = e => {
      const tr = e.target.closest('tr.r');
      if (!tr) return;
      const open = tr.nextElementSibling;
      if (open && open.classList.contains('unfold')) { open.remove(); return; }
      body.querySelectorAll('tr.unfold').forEach(x => x.remove());
      tr.insertAdjacentHTML('afterend', unfold(rows[+tr.dataset.i]));
    };
    // Hovering a row marks the chart point that covers it. A pre-threshold row
    // marks nothing, because there is no point covering it to mark.
    body.onmouseover = e => {
      const tr = e.target.closest('tr.r');
      if (tr) LINK.markChart(tr.dataset.drawn === '1' ? +tr.dataset.month : null);
    };
    body.onmouseleave = () => LINK.markChart(null);
  });
}

// What a player is, said once. The run's own tag answers the Goalkeeper
// question - it is the definition he was rated under - and the vendor's position
// covers the rest, including the men the run never saw start in goal.
function positionChip(p) {
  if (p.goalkeeper) {
    return p.pos && p.pos !== 'Goalkeeper' ? 'Goalkeeper · listed ' + p.pos : 'Goalkeeper';
  }
  if (p.pos === 'Goalkeeper') return 'listed Goalkeeper · never started in goal';
  return p.pos || 'position unknown';
}

function idcard(p) {
  return `<div class="idcard">
    <h2>${p.name}</h2>
    <span class="chip">${p.club ? esc(p.club) : 'club unknown'}</span>
    <span class="chip">${positionChip(p)}</span>
    <span class="chip">${p.y0}–${p.y1}</span>
    <span class="chip">${p.mins.toLocaleString()} min · ${p.apps} matches</span>
    ${p.dupe ? '<span class="chip" style="color:#ffb454">shares this name</span>' : ''}
  </div>`;
}

// ---------------------------------------------------------------- the page
// A browse rail, not a search box (#35): the population is the page and the
// name filter is one control among several. Sorted by peak Impact, because the
// player being looked for is nearly always the better one.
const app = document.getElementById('app');
app.innerHTML = `<div class="grid">
  <div class="rail">
    <div class="filters">
      <input id="q" placeholder="Filter by name" autofocus>
      <div class="row">
        <select id="pos"><option value="">Any position</option><option>Goalkeeper</option>
          <option>Defender</option><option>Midfield</option><option>Attack</option></select>
        <select id="min"><option value="1000">1,000+ min</option>
          <option value="9000">9,000+ min</option><option value="20000">20,000+ min</option></select>
      </div>
      <div class="row"><select id="sort"><option value="peak">Sort: peak Impact</option>
        <option value="mins">Sort: minutes</option><option value="name">Sort: name</option>
        <option value="recent">Sort: most recent</option></select></div>
      <div class="dim" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="main" id="main"></div>
</div>`;

const $ = s => document.querySelector(s);
const SHOWN = 400;
let rows = [], cur = null;

// #35's ranking, and the order of the three terms is the decision: an exact
// name first, then a prefix, and peak Impact only as the tiebreak between
// equals - "the player you meant is nearly always the better one" is a
// tiebreak, not a ranking, or Messi would outrank an exact match on a lesser
// name. Only the default sort ranks this way; the other three are the reader
// asking for a different order outright.
const matchTier = (p, q) => (p.f === q ? 2 : p.f.startsWith(q) ? 1 : 0);

function apply() {
  const q = fold($('#q').value.trim()), pos = $('#pos').value;
  const min = +$('#min').value, s = $('#sort').value;
  // Goalkeeper is the run's own tag, so the filter finds the men the model
  // rated as one - including those the vendor's players table never names, which
  // is more than half the rated population. The other three come from the
  // vendor, which is the only thing that records them.
  const isPos = p => pos === 'Goalkeeper' ? p.goalkeeper : p.pos === pos;
  rows = ALL.filter(p => p.mins >= min && (!pos || isPos(p)) && (!q || p.f.includes(q)));
  rows.sort(s === 'peak'
      ? (a, b) => (q ? matchTier(b, q) - matchTier(a, q) : 0) || b.peak - a.peak
    : s === 'mins' ? (a, b) => b.mins - a.mins
    : s === 'name' ? (a, b) => a.f.localeCompare(b.f)
    : (a, b) => b.y1 - a.y1 || b.peak - a.peak);
  $('#count').textContent = rows.length.toLocaleString() + ' of ' + RUN.players + ' players';
  $('#list').innerHTML = rows.slice(0, SHOWN).map((p, i) =>
    `<div class="item ${p === cur ? 'sel' : ''}" data-i="${i}">
      <div class="rk">${i + 1}</div>
      <div>${p.name}<div class="dim" style="font-size:12px">${p.club ? esc(p.club) : '—'} · ${p.y0}–${p.y1}</div></div>
      <div class="pk">${p.peak ?? '—'}</div></div>`).join('')
    + (rows.length > SHOWN
        ? `<div class="dim" style="padding:12px">…${(rows.length - SHOWN).toLocaleString()}
             more; keep filtering</div>` : '');
  if (!cur && rows[0]) show(rows[0]);
}

// Three numbers that a single "peak" used to conflate. Two of them exist:
// where the line ends, and the highest it ever reached. The third - the peak
// the model estimates NOW - is #41's, and is unbuilt rather than approximated.
function show(p) {
  cur = p;
  // Cleared before the panel is rebuilt: the log loads asynchronously, so a
  // stale byMonth left over from the last player would let his chart scroll
  // this one's log.
  LINK.byMonth = LINK.scroller = null;
  LINK.markChart = () => {};
  $('#main').innerHTML = idcard(p)
    + `<div class="row" style="margin:14px 0 6px">
         <div class="figure"><div class="dim">Impact now</div>
           <div class="big">${p.latest.toFixed(1)}</div></div>
         <div class="figure"><div class="dim">Highest Impact reached</div>
           <div class="big" style="font-size:24px">${p.peak.toFixed(1)}</div></div>
         <div class="figure"><div class="dim">Peak Impact <span style="font-size:11px">estimated now</span></div>
           <div class="big" style="font-size:24px;color:var(--dim)">—</div></div>
       </div>`
    + chart(p)
    + `<p class="dim" style="font-size:12px">Peak Impact — the projected peak the
         model re-estimates at every update — is not built yet (#41), so no second
         line is drawn. Nothing here is a stand-in for it.
         ${p.sm.length ? `The strip under the chart is where he was playing: a band opens at
         his first recorded match for a club and runs until the next one opens, so a
         boundary is a first appearance rather than a transfer date, and a loan is a band
         like any other. National-team matches open no band. Clubs the snapshot cannot name
         leave the band before them running on.` : ''}</p>`
    + `<div class="log" id="logpanel"><h3>Match log</h3>
         <div class="dim">Loading his matches…</div></div>`
    + `<div class="foot">Run <code>${RUN.id}</code> · matches through
         <b>${RUN.lastMatch}</b> · Impact index: 100 is the population average,
         20 points is one standard deviation (ADR 0011), measured over players past
         ${P.ELIGIBLE_MINUTES.toLocaleString()} career minutes. Rank ticks measured
         ${P.RANK_MEASURED} over matches through ${P.RANK_MATCHES_THROUGH}, active
         pool ${P.RANK_POOL.toLocaleString()}; they are a pinned reading aid, not a
         live ranking. The line is drawn faded before <b>${P.BURNIN_LABEL}</b>, where the
         population had not spread out yet and every career reads nearer the average than it
         was; that boundary is pinned too, measured ${P.BURNIN_MEASURED} over an active pool
         of ${P.BURNIN_POOL.toLocaleString()}.</div>`;
  wireHover($('#main'));
  renderLog(p, $('#main'));
}

$('#list').onclick = e => {
  const el = e.target.closest('.item');
  if (el) { show(rows[+el.dataset.i]); apply(); }
};
['#q', '#pos', '#min', '#sort'].forEach(s => $(s).oninput = apply);
apply();
</script>
